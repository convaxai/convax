name: Bug report
description: Report a reproducible problem in Convax
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Convax. Please provide enough detail for someone else to reproduce the problem. Remove secrets and sensitive information from logs and attachments.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the area most closely related to the problem.
      options:
        - Desktop application
        - Canvas
        - Projects and files
        - Plugins and Marketplace
        - Collaboration and sync
        - Agent
        - Web and documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and how did it affect your work?
      placeholder: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Convax version or commit
      description: Use the application version when available; otherwise provide the commit hash.
      placeholder: e.g. 0.1.0 or 8f9a824

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and any other relevant runtime details.
      placeholder: |
        - OS: macOS 15.5
        - Architecture: arm64
        - Installation: downloaded build or local build
    validations:
      required: true

  - type: input
    id: regression
    attributes:
      label: Last known working version
      description: If this is a regression, provide the most recent version or commit where it worked.
      placeholder: e.g. 0.0.9, 40433ee, or Not known

  - type: textarea
    id: additional-context
    attributes:
      label: Logs and additional context
      description: Add sanitized logs, screenshots, recordings, crash reports, or related links.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
