name: Issue report
description: Report a reproducible problem or propose an improvement
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Convax. Please provide enough detail for someone else to verify the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, or what would you like to improve?
      placeholder: Describe the issue and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence that demonstrates the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Convax version or commit
      placeholder: e.g. 0.1.0 or fabb6ba

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and any other relevant runtime details.
      placeholder: |
        - OS: macOS 15.5
        - Architecture: arm64
        - Installation: local build

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, screenshots, recordings, or related links. Remove sensitive information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive information from the report.
          required: true
