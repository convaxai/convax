name: Prepare Plugin SDK bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: Initial @convax/plugin-sdk version
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-sdk-bootstrap-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: convaxai/convax
      REPOSITORY_ID: "1322708874"
      REPOSITORY_OWNER_ID: "312877127"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected bootstrap identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$REPOSITORY_OWNER_ID"
          test "$GITHUB_REF" = refs/heads/main
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          test "$VERSION" = 0.1.0
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main
          test "$(jq -r '.name' packages/plugin-sdk/package.json)" = "@convax/plugin-sdk"
          test "$(jq -r '.version' packages/plugin-sdk/package.json)" = "$VERSION"
          test "$(jq -r '.name' packages/plugin-api/package.json)" = "@convax/plugin-api"
          api_version="$(jq -r '.version' packages/plugin-api/package.json)"
          [[ "$api_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Require a genuinely unpublished SDK package
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/npm-view-sdk.json"
          if npm view "@convax/plugin-sdk" version \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent >"$output" 2>&1; then
            echo "@convax/plugin-sdk already exists; use the staged-publication workflow" >&2
            exit 1
          fi
          jq -e '.error.code == "E404"' "$output" >/dev/null
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the exact SDK release conformance profile
        run: bun scripts/plugin-sdk-release-conformance.ts --output "$RUNNER_TEMP/plugin-sdk-check-results.json"
      - name: Build exact bootstrap evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-sdk-bootstrap"
          inspection="$RUNNER_TEMP/plugin-sdk-bootstrap-inspection"
          mkdir "$evidence" "$inspection"
          api_version="$(jq -r '.version' packages/plugin-api/package.json)"

          npm view "@convax/plugin-api@$api_version" dist \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent > "$inspection/api-npm-dist.json"
          api_tarball_url="$(jq -r '.tarball' "$inspection/api-npm-dist.json")"
          api_integrity="$(jq -r '.integrity' "$inspection/api-npm-dist.json")"
          test "${api_tarball_url#https://registry.npmjs.org/}" != "$api_tarball_url"
          [[ "$api_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          api_tarball="$evidence/convax-plugin-api-$api_version.tgz"
          curl --fail --location --silent --show-error \
            --max-filesize 33554432 \
            "$api_tarball_url" \
            --output "$api_tarball"
          test "$(stat -c '%s' "$api_tarball")" -le 33554432
          test "sha512-$(openssl dgst -sha512 -binary "$api_tarball" | base64 -w0)" = "$api_integrity"

          (
            cd packages/plugin-sdk
            bun pm pack \
              --ignore-scripts \
              --destination "$evidence" \
              --quiet
          )
          sdk_tarball="$evidence/convax-plugin-sdk-$VERSION.tgz"
          test -f "$sdk_tarball"
          test "$(stat -c '%s' "$sdk_tarball")" -le 33554432
          tar -tzf "$sdk_tarball" > "$inspection/sdk-inventory.txt"
          tar -tzf "$api_tarball" > "$inspection/api-inventory.txt"
          test "$(awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }' "$inspection/sdk-inventory.txt")" -eq 1
          test "$(awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }' "$inspection/api-inventory.txt")" -eq 1
          test "$(awk '$0 == "package/dist/generated/plugin-api.json" { count += 1 } END { print count + 0 }' "$inspection/api-inventory.txt")" -eq 1
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$inspection/sdk-inventory.txt" ||
            grep -Fq '\' "$inspection/sdk-inventory.txt" ||
            grep -Eq '(^/|(^|/)\.\.(/|$))' "$inspection/api-inventory.txt" ||
            grep -Fq '\' "$inspection/api-inventory.txt"; then
            echo "package tarball contains an unsafe path" >&2
            exit 1
          fi
          tar -xOzf "$sdk_tarball" package/package.json |
            head -c 131073 > "$inspection/sdk-package.json"
          tar -xOzf "$api_tarball" package/package.json |
            head -c 131073 > "$inspection/api-package.json"
          tar -xOzf "$api_tarball" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$inspection/api-package-catalog.json"
          test "$(stat -c '%s' "$inspection/sdk-package.json")" -le 131072
          test "$(stat -c '%s' "$inspection/api-package.json")" -le 131072
          test "$(stat -c '%s' "$inspection/api-package-catalog.json")" -le 16777216
          ! grep -Eq 'workspace:|catalog:' "$inspection/sdk-package.json"
          cp packages/plugin-api/generated/plugin-api.json "$evidence/plugin-api.json"
          sdk_integrity="sha512-$(openssl dgst -sha512 -binary "$sdk_tarball" | base64 -w0)"

          bun scripts/plugin-sdk-release-evidence.ts \
            --api-catalog "$evidence/plugin-api.json" \
            --api-package-catalog "$inspection/api-package-catalog.json" \
            --api-package-json "$inspection/api-package.json" \
            --api-tarball "$api_tarball" \
            --api-tarball-integrity "$api_integrity" \
            --api-version "$api_version" \
            --check-results "$RUNNER_TEMP/plugin-sdk-check-results.json" \
            --commit "$COMMIT" \
            --output "$evidence/host-package-release.json" \
            --repository "$REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --sdk-package-json "$inspection/sdk-package.json" \
            --sdk-source-tarball "$sdk_tarball" \
            --sdk-tarball "$sdk_tarball" \
            --sdk-tarball-integrity "$sdk_integrity" \
            --sdk-version "$VERSION" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
          (
            cd "$evidence"
            sha256sum \
              "convax-plugin-sdk-$VERSION.tgz" \
              "convax-plugin-api-$api_version.tgz" \
              plugin-api.json \
              host-package-release.json > SHA256SUMS
            sha512sum "convax-plugin-sdk-$VERSION.tgz" > SHA512SUMS
          )
          {
            echo "This workflow does not publish the initial package."
            echo "An independent @convax npm maintainer must verify every Sigstore bundle and checksum,"
            echo "then publish this exact SDK tarball with interactive 2FA:"
            echo
            echo "NPM_CONFIG_PROVENANCE=false npm publish ./convax-plugin-sdk-$VERSION.tgz --access public --registry=https://registry.npmjs.org"
          } > "$evidence/PUBLISH-INSTRUCTIONS.txt"
          echo "directory=$evidence" >> "$GITHUB_OUTPUT"
      - name: Upload unprivileged bootstrap candidate
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: plugin-sdk-bootstrap-candidate
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: convaxai/convax
      REPOSITORY_ID: "1322708874"
      REPOSITORY_OWNER_ID: "312877127"
    steps:
      - name: Verify protected signing identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$REPOSITORY_OWNER_ID"
          test "$GITHUB_REF" = refs/heads/main
          test "$COMMIT" = "$GITHUB_SHA"
          test "$VERSION" = 0.1.0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: plugin-sdk-bootstrap-candidate
          path: ${{ runner.temp }}/plugin-sdk-bootstrap
      - name: Verify candidate without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-sdk-bootstrap"
          test "$(stat -c '%s' "$evidence/host-package-release.json")" -le 262144
          test "$(stat -c '%s' "$evidence/plugin-api.json")" -le 16777216
          test "$(stat -c '%s' "$evidence/SHA256SUMS")" -le 65536
          test "$(stat -c '%s' "$evidence/SHA512SUMS")" -le 65536
          api_version="$(jq -r '.dependencies[0].resolvedVersion' "$evidence/host-package-release.json")"
          [[ "$api_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sdk_tarball="$evidence/convax-plugin-sdk-$VERSION.tgz"
          api_tarball="$evidence/convax-plugin-api-$api_version.tgz"
          test "$(stat -c '%s' "$sdk_tarball")" -le 33554432
          test "$(stat -c '%s' "$api_tarball")" -le 33554432
          (
            cd "$evidence"
            sha256sum --check SHA256SUMS
            sha512sum --check SHA512SUMS
          )
          sdk_package="$RUNNER_TEMP/plugin-sdk-package.json"
          api_package="$RUNNER_TEMP/plugin-api-package.json"
          api_catalog="$RUNNER_TEMP/plugin-api-catalog.json"
          tar -xOzf "$sdk_tarball" package/package.json |
            head -c 131073 > "$sdk_package"
          tar -xOzf "$api_tarball" package/package.json |
            head -c 131073 > "$api_package"
          tar -xOzf "$api_tarball" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$api_catalog"
          test "$(stat -c '%s' "$sdk_package")" -le 131072
          test "$(stat -c '%s' "$api_package")" -le 131072
          test "$(stat -c '%s' "$api_catalog")" -le 16777216
          ! grep -Eq 'workspace:|catalog:' "$sdk_package"
          jq -e \
            --arg api_version "$api_version" \
            --arg version "$VERSION" \
            '
              .name == "@convax/plugin-sdk" and
              .version == $version and
              .dependencies == { "@convax/plugin-api": ("^" + $api_version) }
            ' "$sdk_package" >/dev/null
          jq -e \
            --arg api_version "$api_version" \
            '.name == "@convax/plugin-api" and .version == $api_version' \
            "$api_package" >/dev/null
          cmp "$api_catalog" "$evidence/plugin-api.json"
          sdk_sha256="$(sha256sum "$sdk_tarball" | awk '{ print $1 }')"
          api_sha256="$(sha256sum "$api_tarball" | awk '{ print $1 }')"
          catalog_sha256="$(sha256sum "$evidence/plugin-api.json" | awk '{ print $1 }')"
          sdk_integrity="sha512-$(openssl dgst -sha512 -binary "$sdk_tarball" | base64 -w0)"
          api_integrity="sha512-$(openssl dgst -sha512 -binary "$api_tarball" | base64 -w0)"
          jq -e \
            --arg api_integrity "$api_integrity" \
            --arg api_sha256 "$api_sha256" \
            --arg api_version "$api_version" \
            --arg catalog_sha256 "$catalog_sha256" \
            --arg commit "$COMMIT" \
            --arg sdk_integrity "$sdk_integrity" \
            --arg sdk_sha256 "$sdk_sha256" \
            --arg version "$VERSION" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg repository_owner_id "$REPOSITORY_OWNER_ID" \
            '
              .schema == "convax.host-package-release/1" and
              .profile == "convax.plugin-sdk-authoring-package/1" and
              keys == ["checks", "dependencies", "host", "package", "profile", "schema", "sigstore", "workflow"] and
              (.host | keys) == ["commit", "repository", "repositoryId", "repositoryOwnerId"] and
              (.workflow | keys) == ["ref"] and
              (.package | keys) == ["name", "tarballIntegrity", "tarballSha256", "version"] and
              .host == {
                repository: "convaxai/convax",
                repositoryId: $repository_id,
                repositoryOwnerId: $repository_owner_id,
                commit: $commit
              } and
              .workflow.ref == $workflow and
              .sigstore == {
                bundle: {
                  mediaType: "application/vnd.dev.sigstore.bundle.v0.3+json",
                  suffix: ".sigstore.json"
                },
                certificate: {
                  identity: ("https://github.com/" + $workflow),
                  oidcIssuer: "https://token.actions.githubusercontent.com",
                  workflowName: "Prepare Plugin SDK bootstrap",
                  workflowRef: "refs/heads/main",
                  repository: "convaxai/convax",
                  sourceSha: $commit,
                  trigger: "workflow_dispatch"
                },
                transparencyLog: { inclusionRequired: true }
              } and
              .package.name == "@convax/plugin-sdk" and
              .package.version == $version and
              .package.tarballSha256 == $sdk_sha256 and
              .package.tarballIntegrity == $sdk_integrity and
              (.dependencies | length) == 1 and
              (.dependencies[0] | keys) == ["catalogSchema", "catalogSha256", "catalogVersion", "declaredRange", "name", "resolvedVersion", "tarballIntegrity", "tarballSha256"] and
              .dependencies[0].name == "@convax/plugin-api" and
              .dependencies[0].declaredRange == ("^" + $api_version) and
              .dependencies[0].resolvedVersion == $api_version and
              .dependencies[0].tarballSha256 == $api_sha256 and
              .dependencies[0].tarballIntegrity == $api_integrity and
              .dependencies[0].catalogSchema == "convax.plugin-api-catalog/3" and
              .dependencies[0].catalogVersion == $api_version and
              .dependencies[0].catalogSha256 == $catalog_sha256 and
              [.checks[].id] == ["plugin-api-release-dependency-build", "plugin-sdk-typecheck", "plugin-sdk-test", "plugin-sdk-pack-check", "package-boundaries", "release-evidence-policy"] and
              all(.checks[]; (keys == ["command", "id", "status"]) and .status == "passed")
            ' "$evidence/host-package-release.json" >/dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign exact bootstrap inputs into the public transparency log
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-sdk-bootstrap"
          api_version="$(jq -r '.dependencies[0].resolvedVersion' "$evidence/host-package-release.json")"
          identity="$(jq -r '.sigstore.certificate.identity' "$evidence/host-package-release.json")"
          issuer="$(jq -r '.sigstore.certificate.oidcIssuer' "$evidence/host-package-release.json")"
          for artifact in \
            "convax-plugin-sdk-$VERSION.tgz" \
            "convax-plugin-api-$api_version.tgz" \
            plugin-api.json \
            host-package-release.json \
            SHA256SUMS \
            SHA512SUMS; do
            bundle="$evidence/$artifact.sigstore.json"
            cosign sign-blob \
              --yes \
              --bundle "$bundle" \
              "$evidence/$artifact"
            test "$(stat -c '%s' "$bundle")" -le 1048576
            jq -e '
              .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json" and
              (.verificationMaterial.certificate.rawBytes | type == "string" and length > 0) and
              (.verificationMaterial.tlogEntries | length == 1) and
              (.verificationMaterial.tlogEntries[0].inclusionPromise.signedEntryTimestamp | type == "string" and length > 0) and
              (.verificationMaterial.tlogEntries[0].inclusionProof.rootHash | type == "string" and length > 0)
            ' "$bundle" >/dev/null
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --certificate-github-workflow-name "Prepare Plugin SDK bootstrap" \
              --certificate-github-workflow-ref refs/heads/main \
              --certificate-github-workflow-repository "$REPOSITORY" \
              --certificate-github-workflow-sha "$COMMIT" \
              --certificate-github-workflow-trigger workflow_dispatch \
              "$evidence/$artifact" >/dev/null
          done
      - name: Upload signed bootstrap evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: plugin-sdk-bootstrap-signed-evidence
          path: ${{ runner.temp }}/plugin-sdk-bootstrap
          if-no-files-found: error
          retention-days: 14
