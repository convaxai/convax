name: Manual desktop installers

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Desktop application channel
        required: true
        default: prod
        type: choice
        options:
          - prod
          - beta
          - dev
      confirm_commit:
        description: Exact 40-character main commit SHA to build
        required: true
        type: string

concurrency:
  group: manual-desktop-installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 (signed and notarized)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'fearclear' &&
      github.triggering_actor == 'fearclear' &&
      inputs.confirm_commit == github.sha
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CONVAX_CHANNEL: ${{ inputs.channel }}
      CONVAX_RELEASE: "true"
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CONVAX_PACKAGED_PROVENANCE_DENYLIST_B64: ${{ vars.PACKAGED_PROVENANCE_DENYLIST_B64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate runner and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$CONVAX_PACKAGED_PROVENANCE_DENYLIST_B64"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck Desktop
        run: bun --cwd packages/desktop typecheck
      - name: Build signed and notarized installers
        run: bun --cwd packages/desktop package:mac
      - name: Verify signature, notarization ticket, and packaged startup
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(packages/desktop/dist/mac*/*.app)
          dmgs=(packages/desktop/dist/*.dmg)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "Expected exactly one packaged macOS application, found ${#apps[@]}" >&2
            exit 1
          fi
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "Expected exactly one macOS DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          codesign --verify --verbose=2 "${dmgs[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmgs[0]}"
          bun packages/desktop/scripts/desktop-packaged-provenance.ts "${apps[0]}"
          bun --cwd packages/desktop scripts/desktop-packaged-smoke.ts
      - name: Upload macOS installers
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: convax-${{ inputs.channel }}-macos-arm64-${{ github.sha }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 (unsigned)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'fearclear' &&
      github.triggering_actor == 'fearclear' &&
      inputs.confirm_commit == github.sha
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CONVAX_CHANNEL: ${{ inputs.channel }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CONVAX_PACKAGED_PROVENANCE_DENYLIST_B64: ${{ vars.PACKAGED_PROVENANCE_DENYLIST_B64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate runner architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected an AMD64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          if ([string]::IsNullOrWhiteSpace($env:CONVAX_PACKAGED_PROVENANCE_DENYLIST_B64)) {
            throw "PACKAGED_PROVENANCE_DENYLIST_B64 is required"
          }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck Desktop
        run: bun --cwd packages/desktop typecheck
      - name: Build unsigned installer
        run: bun --cwd packages/desktop package:win
      - name: Verify unsigned installer and packaged startup
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "packages/desktop/dist/*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned Windows installer, got $($signature.Status)"
          }
          bun packages/desktop/scripts/desktop-packaged-provenance.ts packages/desktop/dist/win-unpacked
          bun --cwd packages/desktop scripts/desktop-packaged-smoke.ts
      - name: Upload Windows installer
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: convax-${{ inputs.channel }}-windows-x64-unsigned-${{ github.sha }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
