name: Publish Plugin SDK immutable evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable @convax/plugin-sdk version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-sdk-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: microvoid/convax
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = refs/heads/convax-next
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git fetch --no-tags origin refs/heads/convax-next:refs/remotes/origin/convax-next
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/convax-next
          test "$(jq -r '.name' packages/plugin-sdk/package.json)" = "@convax/plugin-sdk"
          test "$(jq -r '.version' packages/plugin-sdk/package.json)" = "$VERSION"
          test "$(jq -r '.name' packages/plugin-api/package.json)" = "@convax/plugin-api"
          api_version="$(jq -r '.version' packages/plugin-api/package.json)"
          [[ "$api_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Fetch exact published npm bytes
        id: npm
        shell: bash
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/plugin-sdk-npm"
          evidence="$RUNNER_TEMP/plugin-sdk-release"
          mkdir "$download" "$evidence"
          api_version="$(jq -r '.version' packages/plugin-api/package.json)"

          npm view "@convax/plugin-sdk@$VERSION" dist \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent > "$download/sdk-npm-dist.json"
          sdk_tarball_url="$(jq -r '.tarball' "$download/sdk-npm-dist.json")"
          sdk_integrity="$(jq -r '.integrity' "$download/sdk-npm-dist.json")"
          test "${sdk_tarball_url#https://registry.npmjs.org/}" != "$sdk_tarball_url"
          [[ "$sdk_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          sdk_tarball="$evidence/convax-plugin-sdk-$VERSION.tgz"
          curl --fail --location --silent --show-error \
            --max-filesize 33554432 \
            "$sdk_tarball_url" \
            --output "$sdk_tarball"
          test "$(stat -c '%s' "$sdk_tarball")" -le 33554432
          test "sha512-$(openssl dgst -sha512 -binary "$sdk_tarball" | base64 -w0)" = "$sdk_integrity"

          npm view "@convax/plugin-api@$api_version" dist \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent > "$download/api-npm-dist.json"
          api_tarball_url="$(jq -r '.tarball' "$download/api-npm-dist.json")"
          api_integrity="$(jq -r '.integrity' "$download/api-npm-dist.json")"
          test "${api_tarball_url#https://registry.npmjs.org/}" != "$api_tarball_url"
          [[ "$api_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          api_tarball="$evidence/convax-plugin-api-$api_version.tgz"
          curl --fail --location --silent --show-error \
            --max-filesize 33554432 \
            "$api_tarball_url" \
            --output "$api_tarball"
          test "$(stat -c '%s' "$api_tarball")" -le 33554432
          test "sha512-$(openssl dgst -sha512 -binary "$api_tarball" | base64 -w0)" = "$api_integrity"

          tar -tzf "$sdk_tarball" > "$download/sdk-inventory.txt"
          tar -tzf "$api_tarball" > "$download/api-inventory.txt"
          test "$(awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }' "$download/sdk-inventory.txt")" -eq 1
          test "$(awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }' "$download/api-inventory.txt")" -eq 1
          test "$(awk '$0 == "package/dist/generated/plugin-api.json" { count += 1 } END { print count + 0 }' "$download/api-inventory.txt")" -eq 1
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$download/sdk-inventory.txt" ||
            grep -Fq '\' "$download/sdk-inventory.txt" ||
            grep -Eq '(^/|(^|/)\.\.(/|$))' "$download/api-inventory.txt" ||
            grep -Fq '\' "$download/api-inventory.txt"; then
            echo "package tarball contains an unsafe path" >&2
            exit 1
          fi
          tar -xOzf "$sdk_tarball" package/package.json |
            head -c 131073 > "$download/sdk-package.json"
          tar -xOzf "$api_tarball" package/package.json |
            head -c 131073 > "$download/api-package.json"
          tar -xOzf "$api_tarball" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$download/api-package-catalog.json"
          test "$(stat -c '%s' "$download/sdk-package.json")" -le 131072
          test "$(stat -c '%s' "$download/api-package.json")" -le 131072
          test "$(stat -c '%s' "$download/api-package-catalog.json")" -le 16777216
          ! grep -Eq 'workspace:|catalog:' "$download/sdk-package.json"
          cp packages/plugin-api/generated/plugin-api.json "$evidence/plugin-api.json"

          echo "api_integrity=$api_integrity" >> "$GITHUB_OUTPUT"
          echo "api_package_catalog=$download/api-package-catalog.json" >> "$GITHUB_OUTPUT"
          echo "api_package_json=$download/api-package.json" >> "$GITHUB_OUTPUT"
          echo "api_tarball=$api_tarball" >> "$GITHUB_OUTPUT"
          echo "api_version=$api_version" >> "$GITHUB_OUTPUT"
          echo "directory=$evidence" >> "$GITHUB_OUTPUT"
          echo "sdk_integrity=$sdk_integrity" >> "$GITHUB_OUTPUT"
          echo "sdk_package_json=$download/sdk-package.json" >> "$GITHUB_OUTPUT"
          echo "sdk_tarball=$sdk_tarball" >> "$GITHUB_OUTPUT"
      - name: Run the exact SDK release conformance profile
        run: bun scripts/plugin-sdk-release-conformance.ts --output "$RUNNER_TEMP/plugin-sdk-check-results.json"
      - name: Bind package evidence to npm, Plugin API and Host commit
        shell: bash
        run: |
          set -euo pipefail
          evidence="${{ steps.npm.outputs.directory }}"
          source_pack="$RUNNER_TEMP/plugin-sdk-release-source-pack"
          mkdir "$source_pack"
          (
            cd packages/plugin-sdk
            bun pm pack \
              --ignore-scripts \
              --destination "$source_pack" \
              --quiet
          )
          source_sdk_tarball="$source_pack/convax-plugin-sdk-$VERSION.tgz"
          test -f "$source_sdk_tarball"
          cmp "$source_sdk_tarball" "${{ steps.npm.outputs.sdk_tarball }}"
          bun scripts/plugin-sdk-release-evidence.ts \
            --api-catalog "$evidence/plugin-api.json" \
            --api-package-catalog "${{ steps.npm.outputs.api_package_catalog }}" \
            --api-package-json "${{ steps.npm.outputs.api_package_json }}" \
            --api-tarball "${{ steps.npm.outputs.api_tarball }}" \
            --api-tarball-integrity "${{ steps.npm.outputs.api_integrity }}" \
            --api-version "${{ steps.npm.outputs.api_version }}" \
            --check-results "$RUNNER_TEMP/plugin-sdk-check-results.json" \
            --commit "$COMMIT" \
            --output "$evidence/host-package-release.json" \
            --repository "$REPOSITORY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --sdk-package-json "${{ steps.npm.outputs.sdk_package_json }}" \
            --sdk-source-tarball "$source_sdk_tarball" \
            --sdk-tarball "${{ steps.npm.outputs.sdk_tarball }}" \
            --sdk-tarball-integrity "${{ steps.npm.outputs.sdk_integrity }}" \
            --sdk-version "$VERSION" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
          (
            cd "$evidence"
            sha256sum \
              "convax-plugin-sdk-$VERSION.tgz" \
              "convax-plugin-api-${{ steps.npm.outputs.api_version }}.tgz" \
              plugin-api.json \
              host-package-release.json > SHA256SUMS
          )
      - name: Upload unprivileged release candidate
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: plugin-sdk-release-candidate
          path: ${{ steps.npm.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: plugin-sdk-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: microvoid/convax
      IMMUTABLE_RELEASES_OPERATOR_GUARD: ${{ vars.CONVAX_IMMUTABLE_RELEASES_ENABLED }}
    steps:
      - name: Verify protected publication identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = refs/heads/convax-next
          test "$COMMIT" = "$GITHUB_SHA"
          test "$IMMUTABLE_RELEASES_OPERATOR_GUARD" = true
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Check artifact-attestation availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_ATTESTATIONS_ACK: ${{ vars.CONVAX_PRIVATE_ATTESTATIONS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$REPOSITORY" --jq '.visibility')"
          case "$visibility" in
            public) ;;
            private | internal) test "$PRIVATE_ATTESTATIONS_ACK" = true ;;
            *) exit 1 ;;
          esac
      - name: Require the real immutable-Release repository setting
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$REPOSITORY/immutable-releases" |
            jq -e '.enabled == true' >/dev/null
          gh release verify --help >/dev/null
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: plugin-sdk-release-candidate
          path: ${{ runner.temp }}/plugin-sdk-release
      - name: Re-fetch npm closure and verify candidate without repository code
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-sdk-release"
          test "$(stat -c '%s' "$evidence/host-package-release.json")" -le 262144
          test "$(stat -c '%s' "$evidence/plugin-api.json")" -le 16777216
          test "$(stat -c '%s' "$evidence/SHA256SUMS")" -le 65536
          api_version="$(jq -r '.dependencies[0].resolvedVersion' "$evidence/host-package-release.json")"
          [[ "$api_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(stat -c '%s' "$evidence/convax-plugin-sdk-$VERSION.tgz")" -le 33554432
          test "$(stat -c '%s' "$evidence/convax-plugin-api-$api_version.tgz")" -le 33554432
          (
            cd "$evidence"
            sha256sum --check SHA256SUMS
          )

          sdk_metadata="$RUNNER_TEMP/npm-sdk-package.json"
          curl --fail --silent --show-error \
            --max-filesize 1048576 \
            "https://registry.npmjs.org/@convax%2fplugin-sdk/$VERSION" \
            --output "$sdk_metadata"
          sdk_tarball_url="$(jq -r '.dist.tarball' "$sdk_metadata")"
          sdk_integrity="$(jq -r '.dist.integrity' "$sdk_metadata")"
          test "${sdk_tarball_url#https://registry.npmjs.org/}" != "$sdk_tarball_url"
          [[ "$sdk_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          registry_sdk="$RUNNER_TEMP/npm-registry-sdk.tgz"
          curl --fail --location --silent --show-error \
            --max-filesize 33554432 \
            "$sdk_tarball_url" \
            --output "$registry_sdk"
          cmp "$registry_sdk" "$evidence/convax-plugin-sdk-$VERSION.tgz"
          test "sha512-$(openssl dgst -sha512 -binary "$registry_sdk" | base64 -w0)" = "$sdk_integrity"

          api_metadata="$RUNNER_TEMP/npm-api-package.json"
          curl --fail --silent --show-error \
            --max-filesize 1048576 \
            "https://registry.npmjs.org/@convax%2fplugin-api/$api_version" \
            --output "$api_metadata"
          api_tarball_url="$(jq -r '.dist.tarball' "$api_metadata")"
          api_integrity="$(jq -r '.dist.integrity' "$api_metadata")"
          test "${api_tarball_url#https://registry.npmjs.org/}" != "$api_tarball_url"
          [[ "$api_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          registry_api="$RUNNER_TEMP/npm-registry-api.tgz"
          curl --fail --location --silent --show-error \
            --max-filesize 33554432 \
            "$api_tarball_url" \
            --output "$registry_api"
          cmp "$registry_api" "$evidence/convax-plugin-api-$api_version.tgz"
          test "sha512-$(openssl dgst -sha512 -binary "$registry_api" | base64 -w0)" = "$api_integrity"

          sdk_package="$RUNNER_TEMP/plugin-sdk-package.json"
          api_package="$RUNNER_TEMP/plugin-api-package.json"
          api_catalog="$RUNNER_TEMP/plugin-api-catalog.json"
          tar -xOzf "$registry_sdk" package/package.json |
            head -c 131073 > "$sdk_package"
          tar -xOzf "$registry_api" package/package.json |
            head -c 131073 > "$api_package"
          tar -xOzf "$registry_api" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$api_catalog"
          test "$(stat -c '%s' "$sdk_package")" -le 131072
          test "$(stat -c '%s' "$api_package")" -le 131072
          test "$(stat -c '%s' "$api_catalog")" -le 16777216
          ! grep -Eq 'workspace:|catalog:' "$sdk_package"
          jq -e \
            --arg api_version "$api_version" \
            --arg version "$VERSION" \
            '
              .name == "@convax/plugin-sdk" and
              .version == $version and
              .dependencies == { "@convax/plugin-api": ("^" + $api_version) }
            ' "$sdk_package" >/dev/null
          jq -e \
            --arg api_version "$api_version" \
            '.name == "@convax/plugin-api" and .version == $api_version' \
            "$api_package" >/dev/null
          cmp "$api_catalog" "$evidence/plugin-api.json"
          sdk_sha256="$(sha256sum "$registry_sdk" | awk '{ print $1 }')"
          api_sha256="$(sha256sum "$registry_api" | awk '{ print $1 }')"
          catalog_sha256="$(sha256sum "$evidence/plugin-api.json" | awk '{ print $1 }')"
          jq -e \
            --arg api_integrity "$api_integrity" \
            --arg api_sha256 "$api_sha256" \
            --arg api_version "$api_version" \
            --arg catalog_sha256 "$catalog_sha256" \
            --arg commit "$COMMIT" \
            --arg sdk_integrity "$sdk_integrity" \
            --arg sdk_sha256 "$sdk_sha256" \
            --arg version "$VERSION" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            '
              .schema == "convax.host-package-release/1" and
              .profile == "convax.plugin-sdk-authoring-package/1" and
              keys == ["checks", "dependencies", "host", "package", "profile", "schema", "workflow"] and
              (.host | keys) == ["commit", "repository"] and
              (.workflow | keys) == ["ref", "runAttempt", "runId"] and
              (.package | keys) == ["name", "tarballIntegrity", "tarballSha256", "version"] and
              .host == { repository: "microvoid/convax", commit: $commit } and
              .workflow.ref == $workflow and
              .package.name == "@convax/plugin-sdk" and
              .package.version == $version and
              .package.tarballSha256 == $sdk_sha256 and
              .package.tarballIntegrity == $sdk_integrity and
              (.dependencies | length) == 1 and
              (.dependencies[0] | keys) == ["catalogSchema", "catalogSha256", "catalogVersion", "declaredRange", "name", "resolvedVersion", "tarballIntegrity", "tarballSha256"] and
              .dependencies[0].name == "@convax/plugin-api" and
              .dependencies[0].declaredRange == ("^" + $api_version) and
              .dependencies[0].resolvedVersion == $api_version and
              .dependencies[0].tarballSha256 == $api_sha256 and
              .dependencies[0].tarballIntegrity == $api_integrity and
              .dependencies[0].catalogSchema == "convax.plugin-api-catalog/3" and
              .dependencies[0].catalogVersion == $api_version and
              .dependencies[0].catalogSha256 == $catalog_sha256 and
              [.checks[].id] == ["plugin-api-release-dependency-build", "plugin-sdk-typecheck", "plugin-sdk-test", "plugin-sdk-pack-check", "package-boundaries", "release-evidence-policy"] and
              all(.checks[]; (keys == ["command", "id", "status"]) and .status == "passed")
            ' "$evidence/host-package-release.json" >/dev/null
      - name: Attest immutable release inputs
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          create-storage-record: false
          subject-path: |
            ${{ runner.temp }}/plugin-sdk-release/convax-plugin-sdk-${{ inputs.version }}.tgz
            ${{ runner.temp }}/plugin-sdk-release/convax-plugin-api-*.tgz
            ${{ runner.temp }}/plugin-sdk-release/plugin-api.json
            ${{ runner.temp }}/plugin-sdk-release/host-package-release.json
            ${{ runner.temp }}/plugin-sdk-release/SHA256SUMS
      - name: Publish and verify immutable Host package Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-sdk-release"
          api_version="$(jq -r '.dependencies[0].resolvedVersion' "$evidence/host-package-release.json")"
          release_tag="plugin-sdk-v$VERSION-$COMMIT"
          if gh release view "$release_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-plugin-sdk-release"
            mkdir "$existing"
            gh release download "$release_tag" \
              --repo "$REPOSITORY" \
              --dir "$existing"
            expected_assets='["SHA256SUMS","convax-plugin-api-'"$api_version"'.tgz","convax-plugin-sdk-'"$VERSION"'.tgz","host-package-release.json","plugin-api.json"]'
            actual_assets="$(
              gh api "repos/$REPOSITORY/releases/tags/$release_tag" |
                jq -c '[.assets[].name] | sort'
            )"
            test "$actual_assets" = "$expected_assets"
            for asset in \
              "convax-plugin-sdk-$VERSION.tgz" \
              "convax-plugin-api-$api_version.tgz" \
              plugin-api.json \
              host-package-release.json \
              SHA256SUMS; do
              cmp "$existing/$asset" "$evidence/$asset"
            done
            gh api "repos/$REPOSITORY/git/ref/tags/$release_tag" |
              jq -e \
                --arg commit "$COMMIT" \
                '.object.type == "commit" and .object.sha == $commit' >/dev/null
            gh release verify "$release_tag" \
              --repo "$REPOSITORY" \
              --format json >/dev/null
            for asset in \
              "convax-plugin-sdk-$VERSION.tgz" \
              "convax-plugin-api-$api_version.tgz" \
              plugin-api.json \
              host-package-release.json \
              SHA256SUMS; do
              gh release verify-asset "$release_tag" \
                "$evidence/$asset" \
                --repo "$REPOSITORY" \
                --format json >/dev/null
            done
            echo "Existing immutable Release matches the exact npm-backed package evidence." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          release_created=false
          cleanup_unverified_release() {
            status="$?"
            if [ "$status" -ne 0 ] && [ "$release_created" = true ]; then
              gh release delete "$release_tag" \
                --repo "$REPOSITORY" \
                --cleanup-tag \
                --yes || true
            fi
            exit "$status"
          }
          trap cleanup_unverified_release EXIT
          gh release create "$release_tag" \
            --repo "$REPOSITORY" \
            --target "$COMMIT" \
            --title "@convax/plugin-sdk $VERSION" \
            --notes "Exact npm SDK, release-time Plugin API dependency and Host package evidence. This is not a capability approval." \
            --latest=false \
            --draft
          release_created=true
          gh release upload "$release_tag" \
            "$evidence/convax-plugin-sdk-$VERSION.tgz" \
            "$evidence/convax-plugin-api-$api_version.tgz" \
            "$evidence/plugin-api.json" \
            "$evidence/host-package-release.json" \
            "$evidence/SHA256SUMS" \
            --repo "$REPOSITORY"
          gh release edit "$release_tag" \
            --repo "$REPOSITORY" \
            --draft=false
          gh release verify "$release_tag" \
            --repo "$REPOSITORY" \
            --format json
          for asset in \
            "convax-plugin-sdk-$VERSION.tgz" \
            "convax-plugin-api-$api_version.tgz" \
            plugin-api.json \
            host-package-release.json \
            SHA256SUMS; do
            gh release verify-asset "$release_tag" \
              "$evidence/$asset" \
              --repo "$REPOSITORY" \
              --format json
          done
          trap - EXIT
          {
            echo "### Immutable Plugin SDK package evidence"
            echo
            echo "- Host: \`$REPOSITORY@$COMMIT\`"
            echo "- package: \`@convax/plugin-sdk@$VERSION\`"
            echo "- release-time API: \`@convax/plugin-api@$api_version\`"
            echo "- Release: \`$release_tag\`"
            sed 's/^/- SHA-256: `/' "$evidence/SHA256SUMS" | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
