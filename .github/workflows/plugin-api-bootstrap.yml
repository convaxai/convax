name: Prepare Plugin API bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: Initial @convax/plugin-api version
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-api-bootstrap-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: microvoid/convax
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected bootstrap identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = refs/heads/convax-next
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          test "$VERSION" = 1.0.0
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git fetch --no-tags origin refs/heads/convax-next:refs/remotes/origin/convax-next
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/convax-next
          test "$(jq -r '.name' packages/plugin-api/package.json)" = "@convax/plugin-api"
          test "$(jq -r '.version' packages/plugin-api/package.json)" = "$VERSION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Require a genuinely unpublished package
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/npm-view.json"
          if npm view "@convax/plugin-api" version \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent >"$output" 2>&1; then
            echo "@convax/plugin-api already exists; use the staged-publication workflow" >&2
            exit 1
          fi
          jq -e '.error.code == "E404"' "$output" >/dev/null
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the exact release conformance profile
        run: bun scripts/plugin-api-release-conformance.ts --output "$RUNNER_TEMP/plugin-api-check-results.json"
      - name: Build exact bootstrap evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-api-bootstrap"
          inspection="$RUNNER_TEMP/plugin-api-bootstrap-inspection"
          mkdir "$evidence" "$inspection"
          (
            cd packages/plugin-api
            bun pm pack \
              --ignore-scripts \
              --destination "$evidence" \
              --quiet
          )
          tarball="$evidence/convax-plugin-api-$VERSION.tgz"
          test -f "$tarball"
          test "$(stat -c '%s' "$tarball")" -le 33554432
          tar -tzf "$tarball" > "$inspection/inventory.txt"
          test "$(awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }' "$inspection/inventory.txt")" -eq 1
          test "$(awk '$0 == "package/dist/generated/plugin-api.json" { count += 1 } END { print count + 0 }' "$inspection/inventory.txt")" -eq 1
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$inspection/inventory.txt" ||
            grep -Fq '\' "$inspection/inventory.txt"; then
            echo "package tarball contains an unsafe path" >&2
            exit 1
          fi
          tar -xOzf "$tarball" package/package.json |
            head -c 131073 > "$inspection/package.json"
          test "$(stat -c '%s' "$inspection/package.json")" -le 131072
          tar -xOzf "$tarball" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$inspection/package-plugin-api.json"
          test "$(stat -c '%s' "$inspection/package-plugin-api.json")" -le 16777216
          cp packages/plugin-api/generated/plugin-api.json "$evidence/plugin-api.json"
          npm_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          bun scripts/plugin-api-release-evidence.ts \
            --catalog "$evidence/plugin-api.json" \
            --check-results "$RUNNER_TEMP/plugin-api-check-results.json" \
            --commit "$COMMIT" \
            --output "$evidence/runtime-conformance.json" \
            --package-catalog "$inspection/package-plugin-api.json" \
            --package-json "$inspection/package.json" \
            --repository "$REPOSITORY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --tarball "$tarball" \
            --tarball-integrity "$npm_integrity" \
            --version "$VERSION" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
          (
            cd "$evidence"
            sha256sum \
              "convax-plugin-api-$VERSION.tgz" \
              plugin-api.json \
              runtime-conformance.json > SHA256SUMS
            sha512sum "convax-plugin-api-$VERSION.tgz" > SHA512SUMS
          )
          {
            echo "This workflow does not publish the initial package."
            echo "An independent @convax npm maintainer must verify the attestation and checksums,"
            echo "then publish this exact tarball with interactive 2FA:"
            echo
            echo "npm publish ./convax-plugin-api-$VERSION.tgz --access public --registry=https://registry.npmjs.org"
          } > "$evidence/PUBLISH-INSTRUCTIONS.txt"
          echo "directory=$evidence" >> "$GITHUB_OUTPUT"
      - name: Upload unprivileged bootstrap candidate
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: plugin-api-bootstrap-candidate
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: plugin-api-bootstrap
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: microvoid/convax
    steps:
      - name: Verify protected attestation identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = refs/heads/convax-next
          test "$COMMIT" = "$GITHUB_SHA"
          test "$VERSION" = 1.0.0
      - name: Check artifact-attestation availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_ATTESTATIONS_ACK: ${{ vars.CONVAX_PRIVATE_ATTESTATIONS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$REPOSITORY" --jq '.visibility')"
          case "$visibility" in
            public) ;;
            private | internal) test "$PRIVATE_ATTESTATIONS_ACK" = true ;;
            *) exit 1 ;;
          esac
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: plugin-api-bootstrap-candidate
          path: ${{ runner.temp }}/plugin-api-bootstrap
      - name: Verify candidate without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-api-bootstrap"
          (
            cd "$evidence"
            sha256sum --check SHA256SUMS
            sha512sum --check SHA512SUMS
          )
          jq -e \
            --arg commit "$COMMIT" \
            --arg version "$VERSION" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            '
              .schema == "convax.plugin-api-runtime-conformance/1" and
              .profile == "convax.plugin-api-host-runtime/1" and
              .host == { repository: "microvoid/convax", commit: $commit } and
              .workflow.ref == $workflow and
              .pluginApi.package == "@convax/plugin-api" and
              .pluginApi.version == $version and
              .pluginApi.catalogSchema == "convax.plugin-api-catalog/3" and
              ([.checks[].id] | unique | length) == (.checks | length) and
              all(.checks[]; .status == "passed")
            ' "$evidence/runtime-conformance.json" >/dev/null
      - name: Attest exact bootstrap inputs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/plugin-api-bootstrap/convax-plugin-api-${{ inputs.version }}.tgz
            ${{ runner.temp }}/plugin-api-bootstrap/plugin-api.json
            ${{ runner.temp }}/plugin-api-bootstrap/runtime-conformance.json
            ${{ runner.temp }}/plugin-api-bootstrap/SHA256SUMS
            ${{ runner.temp }}/plugin-api-bootstrap/SHA512SUMS
