name: Stage Plugin API npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: New stable @convax/plugin-api version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-api-npm-stage-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: microvoid/convax
      REPOSITORY_ID: "1293264965"
      REPOSITORY_OWNER_ID: "125447777"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$REPOSITORY_OWNER_ID"
          test "$GITHUB_REF" = refs/heads/convax-next
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git fetch --no-tags origin refs/heads/convax-next:refs/remotes/origin/convax-next
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/convax-next
          test "$(jq -r '.name' packages/plugin-api/package.json)" = "@convax/plugin-api"
          test "$(jq -r '.version' packages/plugin-api/package.json)" = "$VERSION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Require an existing package and an unused version
        shell: bash
        run: |
          set -euo pipefail
          npm view "@convax/plugin-api" version \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent >/dev/null
          output="$RUNNER_TEMP/npm-view-version.json"
          if npm view "@convax/plugin-api@$VERSION" version \
            --registry=https://registry.npmjs.org \
            --json --loglevel=silent >"$output" 2>&1; then
            echo "@convax/plugin-api@$VERSION already exists and cannot be reused" >&2
            exit 1
          fi
          jq -e '.error.code == "E404"' "$output" >/dev/null
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the exact release conformance profile
        run: bun scripts/plugin-api-release-conformance.ts --output "$RUNNER_TEMP/plugin-api-check-results.json"
      - name: Build and verify exact staged bytes
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-api-npm-stage"
          inspection="$RUNNER_TEMP/plugin-api-npm-stage-inspection"
          mkdir "$evidence" "$inspection"
          (
            cd packages/plugin-api
            bun pm pack \
              --ignore-scripts \
              --destination "$evidence" \
              --quiet
          )
          tarball="$evidence/convax-plugin-api-$VERSION.tgz"
          test -f "$tarball"
          test "$(stat -c '%s' "$tarball")" -le 33554432
          tar -tzf "$tarball" > "$inspection/inventory.txt"
          test "$(awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }' "$inspection/inventory.txt")" -eq 1
          test "$(awk '$0 == "package/dist/generated/plugin-api.json" { count += 1 } END { print count + 0 }' "$inspection/inventory.txt")" -eq 1
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$inspection/inventory.txt" ||
            grep -Fq '\' "$inspection/inventory.txt"; then
            echo "package tarball contains an unsafe path" >&2
            exit 1
          fi
          tar -xOzf "$tarball" package/package.json |
            head -c 131073 > "$inspection/package.json"
          test "$(stat -c '%s' "$inspection/package.json")" -le 131072
          tar -xOzf "$tarball" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$inspection/package-plugin-api.json"
          test "$(stat -c '%s' "$inspection/package-plugin-api.json")" -le 16777216
          cp packages/plugin-api/generated/plugin-api.json "$evidence/plugin-api.json"
          npm_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          bun scripts/plugin-api-release-evidence.ts \
            --catalog "$evidence/plugin-api.json" \
            --check-results "$RUNNER_TEMP/plugin-api-check-results.json" \
            --commit "$COMMIT" \
            --output "$evidence/runtime-conformance.json" \
            --package-catalog "$inspection/package-plugin-api.json" \
            --package-json "$inspection/package.json" \
            --repository "$REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --tarball "$tarball" \
            --tarball-integrity "$npm_integrity" \
            --version "$VERSION" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
          (
            cd "$evidence"
            sha256sum \
              "convax-plugin-api-$VERSION.tgz" \
              plugin-api.json \
              runtime-conformance.json > SHA256SUMS
            sha512sum "convax-plugin-api-$VERSION.tgz" > SHA512SUMS
          )
          echo "directory=$evidence" >> "$GITHUB_OUTPUT"
      - name: Upload unprivileged staged candidate
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: plugin-api-npm-stage-candidate
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      REPOSITORY: microvoid/convax
      REPOSITORY_ID: "1293264965"
      REPOSITORY_OWNER_ID: "125447777"
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - name: Verify protected staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$REPOSITORY_OWNER_ID"
          test "$GITHUB_REF" = refs/heads/convax-next
          test "$COMMIT" = "$GITHUB_SHA"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: plugin-api-npm-stage-candidate
          path: ${{ runner.temp }}/plugin-api-npm-stage
      - name: Verify candidate without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-api-npm-stage"
          test "$(stat -c '%s' "$evidence/runtime-conformance.json")" -le 262144
          test "$(stat -c '%s' "$evidence/plugin-api.json")" -le 16777216
          test "$(stat -c '%s' "$evidence/SHA256SUMS")" -le 65536
          test "$(stat -c '%s' "$evidence/SHA512SUMS")" -le 65536
          tarball="$evidence/convax-plugin-api-$VERSION.tgz"
          test "$(stat -c '%s' "$tarball")" -le 33554432
          (
            cd "$evidence"
            sha256sum --check SHA256SUMS
            sha512sum --check SHA512SUMS
          )
          package_json="$RUNNER_TEMP/plugin-api-package.json"
          package_catalog="$RUNNER_TEMP/plugin-api-catalog.json"
          tar -xOzf "$tarball" package/package.json |
            head -c 131073 > "$package_json"
          tar -xOzf "$tarball" package/dist/generated/plugin-api.json |
            head -c 16777217 > "$package_catalog"
          test "$(stat -c '%s' "$package_json")" -le 131072
          test "$(stat -c '%s' "$package_catalog")" -le 16777216
          jq -e \
            --arg version "$VERSION" \
            '.name == "@convax/plugin-api" and .version == $version' \
            "$package_json" >/dev/null
          cmp "$package_catalog" "$evidence/plugin-api.json"
          tarball_sha256="$(sha256sum "$tarball" | awk '{ print $1 }')"
          catalog_sha256="$(sha256sum "$evidence/plugin-api.json" | awk '{ print $1 }')"
          tarball_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          contract_coverage="$(jq -c '[.apis[] | { id, digest: .contract.digest }] | sort_by(.id)' "$evidence/plugin-api.json")"
          contract_coverage_sha256="$(printf %s "$contract_coverage" | sha256sum | awk '{ print $1 }')"
          jq -e \
            --arg catalog_sha256 "$catalog_sha256" \
            --arg commit "$COMMIT" \
            --arg contract_coverage_sha256 "$contract_coverage_sha256" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg repository_owner_id "$REPOSITORY_OWNER_ID" \
            --arg tarball_integrity "$tarball_integrity" \
            --arg tarball_sha256 "$tarball_sha256" \
            --arg version "$VERSION" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --slurpfile catalog "$evidence/plugin-api.json" \
            '
              .schema == "convax.plugin-api-runtime-conformance/1" and
              .profile == "convax.plugin-api-host-runtime/1" and
              keys == ["checks", "host", "pluginApi", "profile", "schema", "sigstore", "workflow"] and
              (.host | keys) == ["commit", "repository", "repositoryId", "repositoryOwnerId"] and
              (.workflow | keys) == ["ref"] and
              .host == {
                repository: "microvoid/convax",
                repositoryId: $repository_id,
                repositoryOwnerId: $repository_owner_id,
                commit: $commit
              } and
              .workflow.ref == $workflow and
              .sigstore == {
                bundle: {
                  mediaType: "application/vnd.dev.sigstore.bundle.v0.3+json",
                  suffix: ".sigstore.json"
                },
                certificate: {
                  identity: ("https://github.com/" + $workflow),
                  oidcIssuer: "https://token.actions.githubusercontent.com",
                  workflowName: "Stage Plugin API npm package",
                  workflowRef: "refs/heads/convax-next",
                  repository: "microvoid/convax",
                  sourceSha: $commit,
                  trigger: "workflow_dispatch"
                },
                transparencyLog: { inclusionRequired: true }
              } and
              .pluginApi.package == "@convax/plugin-api" and
              (.pluginApi | keys) == ["catalogSchema", "catalogSha256", "contractCoverage", "contractCoverageSha256", "package", "tarballIntegrity", "tarballSha256", "version"] and
              .pluginApi.version == $version and
              .pluginApi.catalogSchema == "convax.plugin-api-catalog/3" and
              .pluginApi.catalogSha256 == $catalog_sha256 and
              .pluginApi.tarballSha256 == $tarball_sha256 and
              .pluginApi.tarballIntegrity == $tarball_integrity and
              .pluginApi.contractCoverage == ($catalog[0].apis | map({ id, digest: .contract.digest }) | sort_by(.id)) and
              .pluginApi.contractCoverageSha256 == $contract_coverage_sha256 and
              [.checks[].id] == ["plugin-api-typecheck", "plugin-api-test", "plugin-api-compat", "plugin-api-generate-check", "plugin-api-pack-check", "release-evidence-policy", "host-runtime-conformance"] and
              all(.checks[]; (keys == ["command", "id", "status"]) and .status == "passed")
            ' "$evidence/runtime-conformance.json" >/dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign and verify the staged candidate through public Rekor
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/plugin-api-npm-stage"
          identity="$(jq -r '.sigstore.certificate.identity' "$evidence/runtime-conformance.json")"
          issuer="$(jq -r '.sigstore.certificate.oidcIssuer' "$evidence/runtime-conformance.json")"
          for artifact in \
            "convax-plugin-api-$VERSION.tgz" \
            plugin-api.json \
            runtime-conformance.json \
            SHA256SUMS \
            SHA512SUMS; do
            bundle="$evidence/$artifact.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$evidence/$artifact"
            test "$(stat -c '%s' "$bundle")" -le 1048576
            jq -e '
              .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json" and
              (.verificationMaterial.certificate.rawBytes | type == "string" and length > 0) and
              (.verificationMaterial.tlogEntries | length == 1) and
              (.verificationMaterial.tlogEntries[0].inclusionPromise.signedEntryTimestamp | type == "string" and length > 0) and
              (.verificationMaterial.tlogEntries[0].inclusionProof.rootHash | type == "string" and length > 0)
            ' "$bundle" >/dev/null
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --certificate-github-workflow-name "Stage Plugin API npm package" \
              --certificate-github-workflow-ref refs/heads/convax-next \
              --certificate-github-workflow-repository "$REPOSITORY" \
              --certificate-github-workflow-sha "$COMMIT" \
              --certificate-github-workflow-trigger workflow_dispatch \
              "$evidence/$artifact" >/dev/null
          done
      - name: Upload signed staging evidence for human review
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: plugin-api-npm-stage-signed-evidence
          path: ${{ runner.temp }}/plugin-api-npm-stage
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - name: Submit candidate to npm staged publishing
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish \
            "$RUNNER_TEMP/plugin-api-npm-stage/convax-plugin-api-$VERSION.tgz" \
            --access public \
            --provenance=false \
            --registry=https://registry.npmjs.org
