name: Package boundaries

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  package-boundaries:
    name: package-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run package:boundaries
