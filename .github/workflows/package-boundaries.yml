name: Quality gates

on:
  pull_request:
  push:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-boundaries:
    name: package-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test Plugin API release evidence and workflow policy
        run: bun test scripts/plugin-api-release-evidence.test.ts scripts/plugin-api-release-workflows.test.ts
      - name: Enforce append-only Plugin API history
        if: github.event_name == 'pull_request'
        run: bun run plugin-api:history-policy --base "${{ github.event.pull_request.base.sha }}"
      - name: Validate repository Skills
        run: bun run skills:check
      - run: bun run package:boundaries
      - name: Test Plugin SDK release evidence and workflow policy
        run: bun test scripts/plugin-sdk-release-evidence.test.ts scripts/plugin-sdk-release-workflows.test.ts

  quality:
    name: quality (linux)
    needs: package-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Check package artifacts
        run: bun run pack:check

  test:
    name: test (${{ matrix.platform }})
    needs: package-boundaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            test_scope: workspace
            desktop_shard: 1/1
          - os: windows-latest
            platform: windows non-desktop
            test_scope: non-desktop
          - os: windows-latest
            platform: windows shard 1/4
            test_scope: desktop
            desktop_shard: 1/4
          - os: windows-latest
            platform: windows shard 2/4
            test_scope: desktop
            desktop_shard: 2/4
          - os: windows-latest
            platform: windows shard 3/4
            test_scope: desktop
            desktop_shard: 3/4
          - os: windows-latest
            platform: windows shard 4/4
            test_scope: desktop
            desktop_shard: 4/4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test workspace
        if: matrix.test_scope == 'workspace'
        run: bun run test
      - name: Test non-Desktop packages
        if: matrix.test_scope == 'non-desktop'
        run: bun turbo test --filter='!@convax/desktop'
      - name: Test Desktop shard
        if: matrix.test_scope == 'desktop'
        run: bun --cwd packages/desktop test
        env:
          CONVAX_DESKTOP_TEST_SHARD: ${{ matrix.desktop_shard }}

  desktop-package:
    name: packaged smoke (${{ matrix.platform }})
    needs: package-boundaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Package and smoke final executable
        if: runner.os == 'macOS'
        run: bun --cwd packages/desktop smoke:packaged
      - name: Package and verify final Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $markers = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | Sort-Object -Unique
          $markersJson = ConvertTo-Json -InputObject $markers -Compress
          $env:CONVAX_PACKAGED_PROVENANCE_DENYLIST_B64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($markersJson))
          bun --cwd packages/desktop package:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun packages/desktop/scripts/desktop-packaged-provenance.ts packages/desktop/dist/win-unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke final executable under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a bun --cwd packages/desktop smoke:packaged
